name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 코드 읽기 권한만 준다 (기술요구사항서: 불필요한 권한 사용 금지)
permissions:
  contents: read

jobs:
  check:
    name: 린트 · 타입 · 테스트 · 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 외부 액션은 태그 대신 커밋 SHA로 고정해 공급망 변조를 막는다
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 포맷 검사
        run: npm run format:check

      - name: 타입 검사
        run: npm run typecheck

      - name: 단위·컴포넌트 테스트
        run: npm test

      - name: 빌드
        run: npm run build
